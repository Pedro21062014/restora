name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-64:
    name: Build Windows 64-bit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Build Tauri App
        run: npx tauri build --target x86_64-pc-windows-gnu

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-64bit
          path: |
            src-tauri/target/x86_64-pc-windows-gnu/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-gnu/release/bundle/msi/*.msi

  build-windows-32:
    name: Build Windows 32-bit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust stable with 32-bit target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Build Tauri App (32-bit)
        run: npx tauri build --target i686-pc-windows-gnu

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-32bit
          path: |
            src-tauri/target/i686-pc-windows-gnu/release/bundle/nsis/*.exe
            src-tauri/target/i686-pc-windows-gnu/release/bundle/msi/*.msi

  build-ubuntu:
    name: Build Ubuntu (deb & AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri App
        run: npx tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm

  build-macos:
    name: Build macOS (DMG)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri App
        run: npx tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz

  create-release:
    name: Create Release
    needs: [build-windows-64, build-windows-32, build-ubuntu, build-macos]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List all downloaded files
        run: find artifacts/ -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.rpm
            artifacts/**/*.dmg
            artifacts/**/*.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: false
          name: 'Restora ${{ github.ref_name }}'
          body: |
            ## 🔄 Restora ${{ github.ref_name }} - File Recovery Tool

            ### 📦 Downloads

            | Plataforma | Arquivo |
            |------------|---------|
            | ️ Windows 64-bit | `Restora_*_x64-setup.exe` |
            | 🖥️ Windows 32-bit (PCs antigos) | `Restora-Setup-*_ia32.exe` |
            | 🐧 Linux .deb | `restora_*_amd64.deb` |
            | 🐧 Linux AppImage | `restora_*_amd64.AppImage` |
            | 🐧 Linux RPM | `restora-*-1.x86_64.rpm` |
            | 🍎 macOS DMG | `Restora_*_aarch64.dmg` |

            ### ✨ Recursos
            - 🔍 Scan rápido e profundo
            - 🖼️ Recuperação de imagens, vídeos, áudios, documentos
            - 🔧 Reparo automático de arquivos danificados
            - 🖼️ Filtro de thumbnails
            - 💻 Funciona com apenas 2GB de RAM
            - 🖥️ Suporte a 32-bit Windows para PCs antigos
            - 🎨 Tema escuro e claro
            - 📱 Ícones SVG modernos

            ### 🚀 Instalação
            - **Windows**: Execute o `.exe` correspondente à sua arquitetura
            - **Linux**: Use o `.deb` (Debian/Ubuntu) ou `.AppImage` (qualquer distro)
            - **macOS**: Abra o `.dmg` e arraste para Applications
